StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Wagtail

[*.md]
BasedOnStyles = Vale, Wagtail

# Disable Vale's built-in rules that don't suit our conversational-instructional tone
Vale.Acronyms = NO
Vale.Clippy = NO
Vale.FirstPerson = NO
Vale.Hedging = NO
Vale.Redundancy = YES
Vale.Repetition = YES
Vale.Spelling = YES
Vale.Terms = NO
Vale.Weasel = NO

# Wagtail-specific rules
Wagtail.SponsorshipMentions = YES
Wagtail.StrategicThemes = YES
Wagtail.SizeFormat = YES
Wagtail.ReleaseFormat = YES